<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO ARCH | 건축사사무소</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- 1. 기본 설정 & 타이포그래피 --- */
        :root {
            --bg-color: #111;
            --text-color: #fff;
            --accent-color: #888;
            --cursor-size: 30px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* 기본 커서 숨김 (커스텀 커서 사용) */
        }

        body {
            font-family: 'Montserrat', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* --- 2. 커스텀 커서 (인터랙션 핵심) --- */
        .cursor {
            position: fixed;
            width: var(--cursor-size);
            height: var(--cursor-size);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            mix-blend-mode: difference; /* 배경과 반전 효과 */
        }

        .cursor.hovered {
            width: 80px;
            height: 80px;
            background-color: #fff;
            border-color: transparent;
            mix-blend-mode: difference;
        }

        /* --- 3. 헤더 & 네비게이션 --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            gap: 40px;
        }

        nav li a {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        nav li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 0;
            background-color: #fff;
            transition: width 0.3s ease;
        }

        nav li a:hover::after {
            width: 100%;
        }

        /* --- 4. 히어로 섹션 (메인) --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1486325212027-8081e485255e?q=80&w=2070&auto=format&fit=crop') no-repeat center/cover;
            opacity: 0.4;
            transform: scale(1.1);
            transition: transform 10s ease; /* 천천히 줌인 */
        }
        
        .hero:hover .hero-bg {
            transform: scale(1);
        }

        .hero-content {
            z-index: 1;
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeUp 1.5s ease forwards 0.5s;
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 200;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #ccc;
            letter-spacing: 5px;
        }

        /* --- 5. 프로젝트 섹션 (그리드) --- */
        .projects {
            padding: 150px 10vw;
            background-color: var(--bg-color);
        }

        .section-title {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 80px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: inline-block;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 100px;
        }

        /* 엇갈린 그리드 효과 (건축적 리듬감) */
        .project-item:nth-child(even) {
            margin-top: 150px;
        }

        .project-item {
            position: relative;
            opacity: 0; /* 스크롤 애니메이션 전 숨김 */
            transform: translateY(50px);
            transition: all 0.8s ease;
        }

        .project-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .img-container {
            width: 100%;
            height: 600px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: grayscale(100%);
        }

        .project-item:hover .img-container img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .project-info h3 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .project-info span {
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        /* --- 6. 애니메이션 키프레임 --- */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .project-grid { grid-template-columns: 1fr; gap: 50px; }
            .project-item:nth-child(even) { margin-top: 0; }
            .hero h1 { font-size: 3rem; }
            header { padding: 20px; }
            .cursor { display: none; } /* 모바일은 커스텀 커서 숨김 */
            * { cursor: auto; }
        }
    </style>
</head>
<body>

    <div class="cursor"></div>

    <header>
        <div class="logo hover-target">STUDIO ARCH.</div>
        <nav>
            <ul>
                <li><a href="projects.html" class="hover-target">Projects</a></li>
                <li><a href="#" class="hover-target">Philosophy</a></li>
                <li><a href="#" class="hover-target">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>Space,<br>Sculpted.</h1>
            <p>공간을 빚다, 삶을 담다</p>
        </div>
    </section>

    <section class="projects">
        <span class="section-title">SELECTED WORKS</span>
        
        <div class="project-grid">
            <div class="project-item">
                <div class="img-container hover-target">
                    <img src="https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2000&auto=format&fit=crop" alt="Project 1">
                </div>
                <div class="project-info">
                    <h3>The Void House</h3>
                    <span>Seoul, 2024</span>
                </div>
            </div>

            <div class="project-item">
                <div class="img-container hover-target">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=2000&auto=format&fit=crop" alt="Project 2">
                </div>
                <div class="project-info">
                    <h3>Concrete Pavilion</h3>
                    <span>Jeju, 2023</span>
                </div>
            </div>

            <div class="project-item">
                <div class="img-container hover-target">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=2000&auto=format&fit=crop" alt="Project 3">
                </div>
                <div class="project-info">
                    <h3>Urban Forest</h3>
                    <span>Busan, 2023</span>
                </div>
            </div>

            <div class="project-item">
                <div class="img-container hover-target">
                    <img src="https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?q=80&w=2000&auto=format&fit=crop" alt="Project 4">
                </div>
                <div class="project-info">
                    <h3>Minimalist Villa</h3>
                    <span>Gyeonggi, 2022</span>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 1. 커스텀 커서 로직
        const cursor = document.querySelector('.cursor');
        const hoverTargets = document.querySelectorAll('.hover-target');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        hoverTargets.forEach(target => {
            target.addEventListener('mouseenter', () => {
                cursor.classList.add('hovered');
            });
            target.addEventListener('mouseleave', () => {
                cursor.classList.remove('hovered');
            });
        });

        // 2. 스크롤 인터랙션 (Intersection Observer)
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        const projectItems = document.querySelectorAll('.project-item');
        projectItems.forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
